[project]
name = "recsys"
version = "0.1.0"
description = "Local AI recommendation system (MovieLens) — ML pipeline + FastAPI backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16",
    "pyyaml>=6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "threadpoolctl>=3.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "truststore>=0.10.5",
]

[project.optional-dependencies]
# Local semantic embeddings (sentence-transformers pulls CPU torch from PyPI on Windows).
embeddings = ["sentence-transformers>=3.0"]
# Optional CUDA 12.8 build of torch (needed for RTX 50xx / Blackwell, sm_120).
gpu = ["torch>=2.7", "sentence-transformers>=3.0"]

[project.scripts]
recsys = "recsys.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.uv]
# CPU (`embeddings`) and CUDA (`gpu`) torch builds cannot be installed together.
conflicts = [[{ extra = "embeddings" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recsys", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: needs the downloaded MovieLens data and trained artifacts (skipped otherwise)",
    "slow: takes more than a few seconds",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom: `x: T = Depends(...)` / `Query(...)` in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends", "fastapi.params.Query"]
